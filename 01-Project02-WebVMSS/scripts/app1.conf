<VirtualHost *:80>
ServerName kubeoncloud.com
ProxyPreserveHost On
ProxyPass /webvm !

# # Use when only IP Addresses are used - Section-15
# ProxyPass / http://10.0.2.241/
# ProxyPassReverse / http://10.0.2.241/

# Use the below when using Private DNS Section - Section-16
ProxyPass / http://applb.ricardoboriba.ninja/
ProxyPassReverse / http://applb.ricardoboriba.ninja/

DocumentRoot /var/www/html
<Directory /var/www/html>
Options -Indexes
Require all granted
</Directory>
</VirtualHost>
